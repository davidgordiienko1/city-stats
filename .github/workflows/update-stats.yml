name: Update City Stats

on:
  schedule:
    # Run at the top of every hour
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Download latest stats
        env:
          NEW_ONEDRIVE_STATS_URL: ${{ secrets.NEW_ONEDRIVE_STATS_URL }}
        run: node download.js

      - name: Validate download
        run: |
          echo "Preview:"
          head -c 200 citystats.json.new
          echo

          if grep -qi "<html" citystats.json.new; then
            echo "ERROR: Received HTML instead of JSON."
            exit 1
          fi

      - name: Commit updated stats
        run: |
          if cmp -s citystats.json.new citystats.json; then
            echo "No changes."
            rm citystats.json.new
            exit 0
          fi

          mv citystats.json.new citystats.json

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add citystats.json

          git commit -m "Update city stats"

          git push

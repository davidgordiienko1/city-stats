<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Department Statistics</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    overflow-x:hidden;
}

body{
    margin:0;
    padding:clamp(12px,3vw,20px);
    font-family:Arial,sans-serif;
    background:#f5f7fa;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:clamp(20px,4vw,30px);
}

.header h1{
    overflow-wrap:anywhere;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));
    gap:clamp(12px,2vw,20px);
}

.card{
    background:white;
    min-width:0;
    padding:clamp(16px,3vw,20px);
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.icon{
    font-size:40px;
}

.current{
    font-size:32px;
    font-weight:bold;
}

.label{
    margin-top:5px;
}

.trend{
    margin-top:10px;
    font-weight:bold;
}

.positive{
    color:green;
}

.negative{
    color:red;
}

.ytd{
    color:#666;
    margin-top:5px;
}
</style>

</head>
<body>

<div class="container">

<div class="header">
    <h1 id="departmentName"></h1>
    <div id="lastUpdated"></div>
</div>

<div id="statsContainer" class="stats-grid"></div>

</div>

<script>

async function loadDepartment(){

    const params = new URLSearchParams(window.location.search);

    const dept = params.get("dept") || "police";

    const response = await fetch("citystats.json");

    const data = await response.json();

    const department = data.departments[dept];

    document.getElementById("departmentName").textContent =
        department.department;

    document.getElementById("lastUpdated").textContent =
        "Last Updated: " + department.lastUpdated;

    const container =
        document.getElementById("statsContainer");

    container.innerHTML = "";

    department.stats.forEach(stat => {

        const trendClass =
            stat.difference >= 0
                ? "positive"
                : "negative";

        const trendArrow =
            stat.difference >= 0
                ? "▲"
                : "▼";

        container.innerHTML += `
            <div class="card">
                <div class="icon">${stat.icon}</div>

                <div class="current">
                    ${stat.current}
                </div>

                <div class="label">
                    ${stat.label}
                </div>

                <div class="trend ${trendClass}">
                    ${trendArrow}
                    ${stat.difference}
                    vs Last Week
                </div>

                <div class="ytd">
                    YTD: ${stat.ytd}
                </div>
            </div>
        `;

    });

}

loadDepartment();

</script>

<script>
// Let an iframe host keep the widget exactly as tall as its content.
const resizeWidget = () => {
    window.parent.postMessage({
        type: "city-stats-resize",
        height: document.body.scrollHeight
    }, "*");
};

new ResizeObserver(resizeWidget).observe(document.documentElement);
window.addEventListener("load", resizeWidget);
</script>

</body>
</html>
